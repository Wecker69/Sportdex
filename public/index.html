<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sportdex</title>
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1 id="view-title" class="brand-title"><span>Sport</span><span>Dex</span></h1>
        </div>
        <div class="sync-pill" id="connection-state">Demo-Modus</div>
      </header>

      <main id="app" class="content" tabindex="-1">
        <section class="view is-active" id="view-dex" aria-labelledby="dex-title">
          <div class="dex-hero">
            <div>
              <h2 id="dex-title">Dein Dex</h2>
              <p id="dex-summary">36 Disziplinen in 12 Kategorien</p>
              <form class="dex-search" id="dex-filter" autocomplete="off">
                <label class="sr-only" for="search-input">Suche</label>
                <input id="search-input" type="search" placeholder="Disziplin suchen">
                <div class="filter-grid">
                  <label>Kategorie
                    <select id="category-filter">
                      <option value="">Alle Kategorien</option>
                    </select>
                  </label>
                  <label>Status
                    <select id="status-filter">
                      <option value="">Alle</option>
                      <option value="offen">Offen</option>
                      <option value="bronze">Bronze</option>
                      <option value="silber">Silber</option>
                      <option value="gold">Gold</option>
                    </select>
                  </label>
                </div>
              </form>
            </div>
          </div>

          <div class="result-row">
            <strong id="result-count">0 von 0</strong>
            <span>Disziplinen sichtbar</span>
          </div>
          <div class="state-box" id="dex-state" hidden></div>
          <div class="dex-grid" id="discipline-list" aria-live="polite"></div>
        </section>

        <section class="view" id="view-feed" aria-labelledby="feed-title">
          <div class="feed-headline">
            <div>
              <h2 id="feed-title">Feed</h2>
              <p>Geteilte Leistungen von dir und Sportlern, denen du folgst.</p>
            </div>
            <button class="ghost-button compact-button" type="button" id="feed-refresh">Aktualisieren</button>
          </div>
          <div class="state-box" id="feed-state" hidden></div>
          <div class="feed-list" id="feed-list" aria-live="polite"></div>
          <button class="ghost-button" type="button" id="feed-more" hidden>Mehr laden</button>
        </section>

        <section class="view" id="view-search" aria-labelledby="search-title">
          <div class="search-panel">
            <h2 id="search-title">Nutzer suchen</h2>
            <p>Finde andere Sportdex-Profile.</p>
            <form class="user-search" id="user-search-form" autocomplete="off">
              <label class="sr-only" for="user-search-input">Nutzer suchen</label>
              <input id="user-search-input" type="search" placeholder="Nutzername suchen">
            </form>
          </div>
          <div class="state-box" id="user-search-state" hidden></div>
          <div class="user-list" id="user-list" aria-live="polite"></div>
        </section>

        <section class="view" id="view-connect" aria-labelledby="connect-title">
          <div class="connect-panel">
            <h2 id="connect-title">Follower</h2>
          </div>
          <div class="connect-tabs" role="tablist" aria-label="Connect-Menue">
            <button class="tab-button is-active" type="button" data-connect-tab="all">Alle</button>
            <button class="tab-button" type="button" data-connect-tab="followers">Follower</button>
            <button class="tab-button" type="button" data-connect-tab="following">Gefolgt</button>
          </div>
          <div class="state-box" id="connect-state" hidden></div>
          <div class="request-list" id="request-list" aria-live="polite"></div>
        </section>

        <section class="view is-auth-restoring" id="view-profile" aria-labelledby="profile-title">
          <div class="profile-card" id="profile-summary">
            <div class="avatar" id="profile-avatar">SD</div>
            <div>
              <p class="eyebrow rank-label rank-sportler" id="profile-rank">Sportler</p>
              <h2 id="profile-title">Nicht angemeldet</h2>
              <div class="profile-metrics" aria-label="Profilzahlen">
                <span><strong id="stat-dex">0</strong> Dex</span>
                <span><strong id="stat-followers">0</strong> Follower</span>
                <span><strong id="stat-following">0</strong> Gefolgt</span>
              </div>
            </div>
          </div>

          <div class="stats-row">
            <div class="stat-card stat-bronze"><strong id="stat-bronze">0</strong><span>Bronze</span></div>
            <div class="stat-card stat-silver"><strong id="stat-silver">0</strong><span>Silber</span></div>
            <div class="stat-card stat-gold"><strong id="stat-gold">0</strong><span>Gold</span></div>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="Profilaktionen">
            <button class="tab-button is-active" type="button" data-auth-tab="login">Anmelden</button>
            <button class="tab-button" type="button" data-auth-tab="register">Registrieren</button>
            <button class="tab-button" type="button" data-auth-tab="edit">Bearbeiten</button>
          </div>

          <div class="state-box" id="profile-state" hidden></div>

          <form class="form-stack auth-pane is-active" id="login-form">
            <label>E-Mail<input name="email" type="email" required autocomplete="email"></label>
            <label>Passwort<input name="password" type="password" required autocomplete="current-password"></label>
            <button type="submit">Anmelden</button>
          </form>

          <form class="form-stack auth-pane" id="register-form">
            <label>E-Mail<input name="email" type="email" required autocomplete="email"></label>
            <label>Passwort<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
            <label>Nutzername<input name="nutzername" type="text" required pattern="[a-z0-9_]{3,24}" placeholder="kleinschreibung"></label>
            <label>Wertungsklasse
              <select name="wertungsklasse" required>
                <option value="m">m</option>
                <option value="w">w</option>
              </select>
            </label>
            <button type="submit">Registrieren</button>
          </form>

          <form class="form-stack auth-pane" id="edit-form">
            <label>Nutzername<input name="nutzername" type="text" required pattern="[a-z0-9_]{3,24}"></label>
            <label>Wertungsklasse
              <select name="wertungsklasse" required>
                <option value="m">m</option>
                <option value="w">w</option>
              </select>
            </label>
            <label>Vorname<input name="vorname" type="text" autocomplete="given-name"></label>
            <label>Nachname<input name="nachname" type="text" autocomplete="family-name"></label>
            <label>Geburtsdatum<input name="geburtsdatum" type="date"></label>
            <label>Beschreibung<textarea name="beschreibung" rows="3" maxlength="240"></textarea></label>
            <button type="submit">Profil speichern</button>
            <button class="ghost-button" type="button" id="logout-button">Abmelden</button>
            <button class="danger-outline-button" type="button" id="delete-profile-button">Profil loeschen</button>
          </form>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button type="button" data-view="feed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v3H4zM4 11h11v3H4zM4 17h16v3H4z"/></svg>
          <span>Feed</span>
        </button>
        <button type="button" data-view="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.1 11.5l4 4 1.4-1.4-4-4A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
          <span>Suche</span>
        </button>
        <button class="is-active" type="button" data-view="dex">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
          <span>Dex</span>
        </button>
        <button type="button" data-view="connect">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
          <strong class="nav-badge" id="connect-badge" hidden>0</strong>
          <span>Connect</span>
        </button>
        <button type="button" data-view="profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0z"/></svg>
          <span>Profil</span>
        </button>
      </nav>
    </div>
    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
